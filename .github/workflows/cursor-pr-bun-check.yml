name: Cursor PR bun check
on: [push]
permissions:
  contents: read
jobs:
  bun-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cbf9be6308aa7e1b1e2cd327d7df479ea582646a
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Run repository check
        run: |
          git update-ref refs/remotes/upstream/main 84f5adc3bbfc0c2a7caecbad78b1b6eedf0a2939
          env -u GITHUB_ACTIONS bun check
