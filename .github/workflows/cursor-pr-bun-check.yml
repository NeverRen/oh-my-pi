name: Cursor PR bun check
on: [push]
permissions:
  contents: read
jobs:
  bun-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: aaff60fa6d1d34d5d81cb4e41635fbea23fe0898
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install matching native addon
        run: |
          work=$(mktemp -d)
          npm pack @oh-my-pi/pi-natives-linux-x64@18.20.0 --pack-destination "$work"
          tar -xzf "$work/oh-my-pi-pi-natives-linux-x64-18.20.0.tgz" -C "$work"
          cp "$work"/package/*.node packages/natives/native/
      - run: bun test packages/ai/test/cursor-caller-headers.test.ts
      - name: Run repository check
        run: |
          git update-ref refs/remotes/upstream/main 84f5adc3bbfc0c2a7caecbad78b1b6eedf0a2939
          env -u GITHUB_ACTIONS bun check
